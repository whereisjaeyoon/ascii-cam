[package]
name = "ascii-cam-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
